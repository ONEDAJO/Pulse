<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090d11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="PULSE"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3"><link rel="icon" type="image/png" href="apple-touch-icon.png?v=3"><title>PULSE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d11}:root{--bg:#090d11;--card:#151d24;--text:#f7f8fa;--muted:#98a5b0;--btn:#1b242c;--btnText:#fff;--line:#303b44;--green:#69da98;--orange:#ffb347;--blue:#63aef5;color-scheme:dark}html[data-theme=light]{--bg:#f5f6f7;--card:#fff;--text:#101720;--muted:#7c8995;--btn:#19222a;--btnText:#fff;--line:#34404a;color-scheme:light}body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{background:var(--bg);height:100dvh;max-width:480px;margin:auto;padding:env(safe-area-inset-top) 18px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr auto;gap:9px;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding-top:2px}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:13px}.name{font-size:22px;font-weight:950;letter-spacing:2px}.sub{font-size:10px;color:var(--muted);letter-spacing:1.5px}.theme{width:44px;height:44px;font-size:19px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:var(--card);border:1.5px solid var(--line);border-radius:17px;padding:13px 11px}.label{font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.step{display:grid;grid-template-columns:46px 1fr 46px;gap:6px;align-items:center;margin-top:9px}.step button{height:47px;font-size:25px}.value{text-align:center;font-size:28px;font-weight:950;white-space:nowrap}.rounds{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:7px}button{border:1px solid var(--line);background:var(--btn);color:var(--btnText);border-radius:12px;font-weight:900;touch-action:manipulation}.rounds button{height:39px;padding:0;font-size:14px;min-width:0}.rounds .sel,#start{background:var(--green);color:#07130c;border-color:var(--green)}.display{display:flex;min-height:0;flex-direction:column;justify-content:center;text-align:center}.phase{font-size:17px;letter-spacing:1.5px;font-weight:950;color:var(--green)}.clock{font-size:clamp(72px,22vw,100px);line-height:1.03;font-weight:950;font-variant-numeric:tabular-nums;margin:5px 0}.round{font-size:14px;color:var(--muted)}.controls{display:grid;grid-template-columns:2fr 1fr;gap:9px}.controls button{height:54px;font-size:17px}.active{grid-template-rows:auto 0 0 1fr auto}.active .settings,.active .roundBox{display:none}.active .clock{font-size:clamp(96px,30vw,135px)}.active .phase{font-size:21px}@media(max-height:720px){.app{gap:6px}.logo{width:40px;height:40px}.box{padding:9px}.step{margin-top:5px;grid-template-columns:42px 1fr 42px}.step button{height:42px}.value{font-size:26px}.rounds{margin-top:4px}.rounds button{height:34px}.clock{font-size:64px}.controls button{height:47px}}</style></head><body><div class="app" id="app"><header class="top"><div class="brand"><img class="logo" src="apple-touch-icon.png?v=3" alt="PULSE"><div><div class="name">PULSE</div><div class="sub">INTERVALLTIMER</div></div></div><button id="theme" class="theme" type="button">☀️</button></header><section class="settings"><div class="box"><div class="label">Träning</div><div class="step"><button data-step="work" data-dir="-1">−</button><div class="value"><span id="wv">45</span>s</div><button data-step="work" data-dir="1">+</button></div></div><div class="box"><div class="label">Vila</div><div class="step"><button data-step="rest" data-dir="-1">−</button><div class="value"><span id="rv">15</span>s</div><button data-step="rest" data-dir="1">+</button></div></div></section><section class="roundBox"><div class="label">Rundor</div><div class="rounds"><button>3</button><button>5</button><button>8</button><button class="sel">10</button><button>12</button><button>15</button><button>20</button></div></section><main class="display"><div class="phase" id="phase">REDO</div><div class="clock" id="clock">00:45</div><div class="round" id="round">Runda 1 / 10</div></main><footer class="controls"><button id="start">Starta</button><button id="reset">Återställ</button></footer></div><script>(()=>{const A=document.querySelector('#app'),q=s=>A.querySelector(s),clock=q('#clock'),phase=q('#phase'),re=q('#round'),start=q('#start'),wv=q('#wv'),rv=q('#rv'),theme=q('#theme');let work=45,rest=15,rounds=10,round=1,state='ready',left=45,timer=null,audio=null,wake=null;const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d,delay=0){try{const a=ac(),t=a.currentTime+delay,m=a.createGain(),c=a.createDynamicsCompressor();[[f,'sine',.72],[f*2,'sine',.24],[f*1.5,'triangle',.17]].forEach(x=>{const o=a.createOscillator(),g=a.createGain();o.type=x[1];o.frequency.value=x[0];g.gain.value=x[2];o.connect(g);g.connect(m);o.start(t);o.stop(t+d)});m.connect(c);c.connect(a.destination);c.threshold.value=-22;c.ratio.value=10;m.gain.setValueAtTime(.001,t);m.gain.exponentialRampToValueAtTime(1.5,t+.012);m.gain.exponentialRampToValueAtTime(.001,t+d)}catch(e){}}const count=()=>tone(1047,.22),warn=()=>tone(880,.17),train=()=>{tone(784,.3);tone(988,.34,.3);tone(1318,.5,.62)},restSound=()=>{tone(659,.36);tone(523,.52,.38)},done=()=>{tone(659,.28);tone(880,.32,.28);tone(1047,.65,.58)};async function awake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}async function sleep(){try{if(wake)await wake.release()}catch(e){}wake=null}function paint(){clock.textContent=fmt(left);re.textContent=`Runda ${round} / ${rounds}`;phase.textContent={ready:'REDO',count:'STARTAR OM',train:'TRÄNING',rest:'VILA',done:'KLART!',paused:'PAUSAD'}[state];phase.style.color=state==='rest'?'var(--orange)':state==='count'?'var(--blue)':'var(--green)';start.textContent=timer?'Pausa':state==='ready'?'Starta':state==='done'?'Starta igen':'Fortsätt';A.classList.toggle('active',!['ready','done'].includes(state))}function stop(){clearInterval(timer);timer=null;sleep();paint()}function run(){awake();timer=setInterval(()=>{left--;if(left>0){if(left<=3)warn();paint();return}if(state==='train'){if(round>=rounds){clearInterval(timer);timer=null;state='done';left=0;done();sleep();paint();return}state='rest';left=rest;restSound()}else{round++;state='train';left=work;train()}paint()},1000)}function launch(){state='count';left=5;paint();count();awake();timer=setInterval(()=>{left--;if(left>0){count();paint();return}clearInterval(timer);timer=null;state='train';left=work;train();paint();run()},1000)}start.onclick=()=>{ac();if(timer){state='paused';stop();return}if(state==='ready'||state==='done'){round=1;launch()}else run()};q('#reset').onclick=()=>{stop();state='ready';round=1;left=work;paint()};A.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let d=Number(b.dataset.dir)*5;if(b.dataset.step==='work'){work=clamp(work+d,5,300);wv.textContent=work;if(state==='ready')left=work}else{rest=clamp(rest+d,5,180);rv.textContent=rest}paint()});A.querySelectorAll('.rounds button').forEach(b=>b.onclick=()=>{rounds=Number(b.textContent);A.querySelectorAll('.rounds button').forEach(x=>x.classList.toggle('sel',x===b));paint()});let mode='dark';try{mode=localStorage.getItem('pulseTheme')||'dark'}catch(e){}function applyTheme(){document.documentElement.dataset.theme=mode;theme.textContent=mode==='dark'?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#090d11':'#f5f6f7'}theme.onclick=()=>{mode=mode==='dark'?'light':'dark';try{localStorage.setItem('pulseTheme',mode)}catch(e){}applyTheme()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timer)awake()});applyTheme();paint()})();</script></body></html>

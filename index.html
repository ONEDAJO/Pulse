<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>Träningstimer</title>
<style>body{margin:0;background:#090d11;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:440px;margin:auto;padding:24px 20px}.tag{text-align:center;color:#39df8f;font-size:11px;font-weight:900;letter-spacing:2px}h1{text-align:center;font-size:28px;margin:7px 0 24px}label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:14px}label b{color:#9ba8b3}input{width:100%;accent-color:#39df8f;margin:9px 0}.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}button{border:1px solid #303b44;background:#182129;color:#fff;border-radius:12px;padding:12px 5px;font-weight:800;font-size:16px}.rounds .sel,#start{background:#39df8f;color:#07130c;border-color:#39df8f}.display{text-align:center;padding:36px 0 30px}.phase{font-size:19px;font-weight:900;color:#39df8f;letter-spacing:1px}.clock{font-size:78px;font-weight:850;line-height:1.1;font-variant-numeric:tabular-nums}.round{color:#9ba8b3;font-size:14px}.controls{display:grid;grid-template-columns:2fr 1fr;gap:9px}.controls button{min-height:54px}@media(max-width:360px){.clock{font-size:64px}}@media(prefers-color-scheme:light){body{background:#f2f5f7;color:#111820}button{background:#fff;color:#111820;border-color:#d4dce1}}</style>
<div class='app' id='app'><div class='tag'>INTERVALLTIMER</div><h1>Träningstimer</h1><label>Träning <b><span id='tv'>45</span> sek</b></label><input id='tr' type='range' min='5' max='120' step='5' value='45'><label>Vila <b><span id='vv'>15</span> sek</b></label><input id='vi' type='range' min='5' max='60' step='5' value='15'><label>Antal rundor</label><div class='rounds'><button>3</button><button>5</button><button>8</button><button class='sel'>10</button><button>12</button><button>15</button><button>20</button></div><div class='display'><div class='phase' id='phase'>REDO</div><div class='clock' id='clock'>00:45</div><div class='round' id='round'>Runda 1 / 10</div></div><div class='controls'><button id='start'>Starta</button><button id='reset'>Återställ</button></div></div>
<script>(()=>{const q=s=>document.querySelector(s),tr=q('#tr'),vi=q('#vi'),tv=q('#tv'),vv=q('#vv'),clock=q('#clock'),phase=q('#phase'),re=q('#round'),start=q('#start');let rounds=10,round=1,state='ready',left=45,timer=null,audio=null;const fmt=n=>'00:'+String(Math.max(0,n)).padStart(2,'0');function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function bell(f,d,delay=0){try{const a=ac(),t=a.currentTime+delay,m=a.createGain(),comp=a.createDynamicsCompressor(),freqs=[f,f*2,f*2.5];freqs.forEach((hz,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=i===2?'triangle':'sine';o.frequency.value=hz;g.gain.value=i===0?.8:i===1?.34:.18;o.connect(g);g.connect(m);o.start(t);o.stop(t+d)});m.connect(comp);comp.connect(a.destination);comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.12;m.gain.setValueAtTime(.001,t);m.gain.exponentialRampToValueAtTime(1.8,t+.012);m.gain.setValueAtTime(1.8,t+Math.max(.02,d*.38));m.gain.exponentialRampToValueAtTime(.001,t+d)}catch(e){}}function count(){bell(1050,.25)}function train(){bell(784,.34);bell(988,.38,.34);bell(1318,.55,.69)}function rest(){bell(659,.42);bell(523,.58,.43)}function done(){bell(659,.34);bell(880,.36,.32);bell(1047,.7,.66)}function paint(){clock.textContent=fmt(left);re.textContent=`Runda ${round} / ${rounds}`;phase.textContent=state==='ready'?'REDO':state==='count'?'STARTAR OM':state==='train'?'TRÄNING':state==='rest'?'VILA':state==='done'?'KLART!':'PAUSAD';phase.style.color=state==='rest'?'#ffb347':state==='count'?'#63aef5':'#39df8f';start.textContent=timer?'Pausa':state==='ready'?'Starta':state==='done'?'Starta igen':'Fortsätt'}function stop(){clearInterval(timer);timer=null;paint()}function run(){timer=setInterval(()=>{left--;if(left>0){paint();return}if(state==='train'){if(round>=rounds){clearInterval(timer);timer=null;state='done';left=0;done();paint();return}state='rest';left=+vi.value;rest()}else{round++;state='train';left=+tr.value;train()}paint()},1000)}function launch(){state='count';left=5;paint();count();timer=setInterval(()=>{left--;if(left>0){count();paint();return}clearInterval(timer);timer=null;state='train';left=+tr.value;train();paint();run()},1000)}start.onclick=()=>{ac();if(timer){stop();return}if(state==='ready'||state==='done'){round=1;launch()}else run()};q('#reset').onclick=()=>{stop();round=1;state='ready';left=+tr.value;paint()};tr.oninput=()=>{tv.textContent=tr.value;if(state==='ready'){left=+tr.value;paint()}};vi.oninput=()=>vv.textContent=vi.value;document.querySelectorAll('.rounds button').forEach(b=>b.onclick=()=>{rounds=+b.textContent;document.querySelectorAll('.rounds button').forEach(x=>x.classList.toggle('sel',x===b));if(round>rounds)round=1;paint()});paint()})();</script>

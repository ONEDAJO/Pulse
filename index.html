(()=>{const $=s=>document.querySelector(s),setup=$('#setup'),session=$('#session'),wv=$('#wv'),rv=$('#rv'),previewTime=$('#previewTime'),previewRound=$('#previewRound'),sessionState=$('#sessionState'),sessionTime=$('#sessionTime'),sessionRound=$('#sessionRound'),pause=$('#pause'),theme=$('#theme');let work=45,rest=15,rounds=10,round=1,state='ready',left=45,timer=null,audio=null,wake=null;const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d,delay=0){try{const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.8,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}const count=()=>tone(1000,.18),warn=()=>tone(880,.14),train=()=>{tone(784,.22);tone(988,.24,.25);tone(1175,.34,.52)},restTone=()=>{tone(659,.28);tone(523,.38,.32)},done=()=>{tone(659,.22);tone(880,.25,.25);tone(1047,.5,.52)};async function awake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}async function sleep(){try{if(wake)await wake.release()}catch(e){}wake=null}function showSession(){setup.classList.add('hidden');session.classList.remove('hidden')}function showSetup(){session.classList.add('hidden');setup.classList.remove('hidden')}function paintSetup(){wv.textContent=work;rv.textContent=rest;previewTime.textContent=fmt(work);previewRound.textContent=`Runda 1 / ${rounds}`}function paintSession(){sessionTime.textContent=fmt(left);sessionRound.textContent=`Runda ${round} / ${rounds}`;sessionState.textContent={count:'STARTAR OM',train:'TRÄNING',rest:'VILA',paused:'PAUSAD',done:'KLART!'}[state]||'TRÄNING';sessionState.style.color=state==='rest'?'var(--orange)':state==='count'?'var(--blue)':'var(--green)';pause.textContent=timer?'Pausa':state==='done'?'Klar':'Fortsätt'}function clear(){if(timer)clearInterval(timer);timer=null}function run(){awake();timer=setInterval(()=>{left--;if(left>0){if(left<=3)warn();paintSession();return}if(state==='train'){if(round>=rounds){clear();state='done';left=0;done();sleep();paintSession();return}state='rest';left=rest;restTone()}else{round++;state='train';left=work;train()}paintSession()},1000)}function launch(){showSession();round=1;state='count';left=5;paintSession();count();awake();timer=setInterval(()=>{left--;if(left>0){count();paintSession();return}clear();state='train';left=work;train();paintSession();run()},1000)}function resetAll(){clear();sleep();state='ready';round=1;left=work;paintSetup();showSetup()}$('#start').onclick=()=>{ac();launch()};pause.onclick=()=>{if(state==='done'){resetAll();return}if(timer){clear();state='paused';sleep();paintSession()}else{state=left===rest?'rest':'train';paintSession();run()}};$('#resetSession').onclick=resetAll;$('#resetSetup').onclick=()=>{work=45;rest=15;rounds=10;document.querySelectorAll('.rounds button').forEach(b=>b.classList.toggle('selected',b.textContent==='10'));paintSetup()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.dir)*5;if(b.dataset.step==='work')work=clamp(work+d,5,300);else rest=clamp(rest+d,5,180);paintSetup()});document.querySelectorAll('.rounds button').forEach(b=>b.onclick=()=>{rounds=Number(b.textContent);document.querySelectorAll('.rounds button').forEach(x=>x.classList.toggle('selected',x===b));paintSetup()});let mode='dark';try{mode=localStorage.getItem('pulseTheme')||'dark'}catch(e){}function applyTheme(){document.documentElement.dataset.theme=mode;theme.textContent=mode==='dark'?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#090e12':'#f4f6f7'}theme.onclick=()=>{mode=mode==='dark'?'light':'dark';try{localStor </script></body></html>

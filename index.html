<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090d11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="PULSE"><link rel="apple-touch-icon" sizes="180x180" href="/Tr-ningstimer/apple-touch-icon.png"><link rel="manifest" href="/Tr-ningstimer/manifest.webmanifest"><title>PULSE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}:root{--bg:#090e12;--card:#151c23;--text:#f7f8fa;--muted:#98a5b0;--btn:#1b242c;--line:#34404a;--green:#78dc9f;--orange:#ffb347;--blue:#6ab0ff;color-scheme:dark}html[data-theme=light]{--bg:#f5f6f7;--card:#fff;--text:#101720;--muted:#707d89;--btn:#19222a;--line:#34404a;color-scheme:light}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;max-width:480px;margin:auto;padding:max(6px,env(safe-area-inset-top)) 18px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.top{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:12px}.name{font-size:21px;font-weight:950;letter-spacing:2px}.sub{font-size:9px;color:var(--muted);letter-spacing:1.4px}.theme{width:44px;height:44px;font-size:19px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:var(--card);border:1.5px solid var(--line);border-radius:17px;padding:12px 10px}.label{font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.step{display:grid;grid-template-columns:45px 1fr 45px;gap:5px;align-items:center;margin-top:8px}.step button{height:45px;font-size:25px}.value{text-align:center;font-size: <button data-step="work" data-dir="1">+</button></div></div><div class="box"><div class="label">Vila</div><div class="step"><button data-step="rest" data-dir="-1">−</button><div class="value"><span id="rv">15</span>s</div><button data-step="rest" data-dir="1">+</button></div></div></section><section class="roundBox"><div class="label">Rundor</div><div class="rounds"><button>3</button><button>5</button><button>8</button><button class="sel">10</button><button>12</button><button>15</button><button>20</button></div></section><main class="display"><div id="phase" class="phase">REDO</div><div id="clock" class="clock">00:45</div><div id="round" class="round">Runda 1 / 10</div></main><footer class="controls"><button id="start">Starta</button><button id="reset">Återställ</button></footer></div><script>(()=>{const A=document.querySelector('#app'),q=s=>A.querySelector(s),clock=q('#clock'),phase=q('#phase'),re=q('#round'),start=q('#start'),wv=q('#wv'),rv=q('#rv'),theme=q('#theme');let work=45,rest=15,rounds=10,round=1,state='ready',left=45,timer=null,audio=null,wake=null;const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`,clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d,delay=0){try{const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.85,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}function count(){tone(1000,.18)}function warn(){tone(880,.14)}function train(){tone(784,.22);tone(988,.24,.25);tone(1175,.34,.52)}function restSound(){tone(659,.28);tone(523,.38,.32)}function done(){tone(659,.22);tone(880,.25,.25);tone(1047,.5,.52)}async function awake(){try{if('wakeLock'in navigator&&!wake)wake=a taset.theme=mode;theme.textContent=mode==='dark'?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').content=mode==='dark'?'#090d11':'#f5f6f7'}theme.onclick=()=>{mode=mode==='dark'?'light':'dark';try{localStorage.setItem('pulseTheme',mode)}catch(e){}applyTheme()};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timer)awake()});applyTheme();paint()})();</script></body></html>

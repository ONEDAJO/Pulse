<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Träningstimer"><title>Träningstimer v2</title>
<style>
:root{color-scheme:dark;--bg:#090d11;--panel:#141b22;--text:#f7f8fa;--muted:#9ba8b3;--line:#303b44;--btn:#182129;--green:#39df8f;--orange:#ffb347;--blue:#63aef5;--shadow:0 16px 50px #0007}html[data-theme=light]{color-scheme:light;--bg:#f2f5f7;--panel:#fff;--text:#111820;--muted:#66727d;--line:#d4dce1;--btn:#f7f9fa;--shadow:0 16px 50px #23303b1c}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s background,.25s color}.app{width:min(100%,480px);min-height:100svh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.tag{color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px}.theme{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}h1{text-align:center;margin:4px 0 20px;font-size:28px}.settings{display:grid;gap:12px}.stepbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}.stepbox>span,.label{font-size:14px;font-weight:800}.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;margin-top:9px}.stepper button{font-size:24px}.value{text-align:center;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}button{border:1px solid var(--line);background:var(--btn);color:var(--text);border-radius:12px;padding:11px 5px;font-weight:850;min-height:46px;touch-action:manipulation}.rounds .sel,#start{background:var(--green);color:#06130c;border-color:var(--green)}.display{text-align:center;display:flex;flex-direction:column;justify-content:center;flex:1;min-height:270px;padding:25px 0}.phase{font-size:20px;font-weight:950;color:var(--green);letter-spacing:1px}.clock{font-size:clamp(70px,22vw,100px);font-weight:900;line-height:1.08;font-variant-numeric:tabular-nums}.round{color:var(--muted);font-size:15px}.controls{display:grid;grid-template-columns:2fr 1fr;gap:9px}.controls button{min-height:56px;font-size:17px}.active .settings,.active h1{display:none}.active .display{min-height:65svh}.active.train{background:linear-gradient(180deg,#153c2a,var(--bg) 55%)}.active.rest{background:linear-gradient(180deg,#3d2c16,var(--bg) 55%)}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.rounds{gap:6px}.clock{font-size:64px}}
</style></head><body><div class="app" id="app"><div class="top"><div class="tag">INTERVALLTIMER V2</div><button class="theme" id="theme" type="button" aria-label="Byt färgläge">☀️</button></div><h1>Träningstimer</h1><section class="settings"><div class="stepbox"><span>Träning</span><div class="stepper"><button type="button" data-step="work" data-dir="-1">−</button><div class="value"><span id="workVal">45</span> sek</div><button type="button" data-step="work" data-dir="1">+</button></div></div><div class="stepbox"><span>Vila</span><div class="stepper"><button type="button" data-step="rest" data-dir="-1">−</button><div class="value"><span id="restVal">15</span> sek</div><button type="button" data-step="rest" data-dir="1">+</button></div></div><div><div class="label">Antal rundor</div><div class="rounds"><button type="button">3</button><button type="button">5</button><button type="button">8</button><button type="button" class="sel">10</button><button type="button">12</button><button type="button">15</button><button type="button">20</button></div></div></section><main class="display"><div class="phase" id="phase">REDO</div><div class="clock" id="clock">00:45</div><div class="round" id="round">Runda 1 / 10</div></main><div class="controls"><button id="start" type="button">Starta</button><button id="reset" type="button">Återställ</button></div></div>
<script>
(()=>{const app=document.querySelector('#app'),q=s=>app.querySelector(s),clock=q('#clock'),phase=q('#phase'),roundEl=q('#round'),start=q('#start'),themeBtn=q('#theme'),wv=q('#workVal'),rv=q('#restVal');let work=45,rest=15,rounds=10,round=1,state='ready',left=45,timer=null,audio=null,wakeLock=null;const clamp=(n,a,b)=>Math.min(b,Math.max(a,n)),fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function chime(f,d,delay=0,boost=1){try{const a=ac(),t=a.currentTime+delay,m=a.createGain(),comp=a.createDynamicsCompressor();[[f,'sine',.72],[f*2,'sine',.25],[f*1.5,'triangle',.18]].forEach(([hz,type,gain])=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=hz;g.gain.value=gain;o.connect(g);g.connect(m);o.start(t);o.stop(t+d)});m.connect(comp);comp.connect(a.destination);comp.threshold.value=-22;comp.knee.value=8;comp.ratio.value=10;comp.attack.value=.002;comp.release.value=.1;m.gain.setValueAtTime(.001,t);m.gain.exponentialRampToValueAtTime(1.5*boost,t+.012);m.gain.setValueAtTime(1.5*boost,t+Math.max(.03,d*.38));m.gain.exponentialRampToValueAtTime(.001,t+d)}catch(e){}}function vibrate(pattern){try{if(typeof navigator.vibrate==='function')navigator.vibrate(pattern)}catch(e){}}function countdownSound(){chime(1047,.23)}function warningSound(){chime(880,.18)}function trainSound(){chime(784,.32);chime(988,.35,.31);chime(1318,.52,.64);vibrate([80,50,80])}function restSound(){chime(659,.38);chime(523,.55,.4);vibrate(160)}function doneSound(){chime(659,.3);chime(880,.34,.29);chime(1047,.68,.62);vibrate([100,60,100,60,220])}
async function acquireWake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}async function releaseWake(){try{await wakeLock?.release()}catch(e){}wakeLock=null}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&timer)acquireWake()});
function paint(){clock.textContent=fmt(left);roundEl.textContent=`Runda ${round} / ${rounds}`;const labels={ready:'REDO',count:'STARTAR OM',train:'TRÄNING',rest:'VILA',done:'KLART!',paused:'PAUSAD'};phase.textContent=labels[state]||'REDO';phase.style.color=state==='rest'?'var(--orange)':state==='count'?'var(--blue)':'var(--green)';start.textContent=timer?'Pausa':state==='ready'?'Starta':state==='done'?'Starta igen':'Fortsätt';app.classList.toggle('active',!['ready','done'].includes(state));app.classList.toggle('train',state==='train');app.classList.toggle('rest',state==='rest')}
function stop(){clearInterval(timer);timer=null;releaseWake();paint()}function run(){acquireWake();timer=setInterval(()=>{left--;if(left>0){if(left<=3)warningSound();paint();return}if(state==='train'){if(round>=rounds){clearInterval(timer);timer=null;state='done';left=0;doneSound();releaseWake();paint();return}state='rest';left=rest;restSound()}else{round++;state='train';left=work;trainSound()}paint()},1000)}function launch(){state='count';left=5;paint();countdownSound();acquireWake();timer=setInterval(()=>{left--;if(left>0){countdownSound();paint();return}clearInterval(timer);timer=null;state='train';left=work;trainSound();paint();run()},1000)}
start.addEventListener('click',()=>{ac();if(timer){state='paused';stop();return}if(state==='ready'||state==='done'){round=1;launch()}else run()});q('#reset').addEventListener('click',()=>{stop();round=1;state='ready';left=work;paint()});app.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const d=Number(b.dataset.dir)*5;if(b.dataset.step==='work'){work=clamp(work+d,5,300);wv.textContent=work;if(state==='ready')left=work}else{rest=clamp(rest+d,5,180);rv.textContent=rest}paint()}));app.querySelectorAll('.rounds button').forEach(b=>b.addEventListener('click',()=>{rounds=Number(b.textContent);app.querySelectorAll('.rounds button').forEach(x=>x.classList.toggle('sel',x===b));if(round>rounds)round=1;paint()}));
let theme='dark';try{theme=localStorage.getItem('timerTheme')||'dark'}catch(e){}function applyTheme(){document.documentElement.dataset.theme=theme;themeBtn.textContent=theme==='dark'?'☀️':'🌙';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#090d11':'#f2f5f7'}themeBtn.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('timerTheme',theme)}catch(e){}applyTheme()});applyTheme();paint()})();
</script></body></html>
